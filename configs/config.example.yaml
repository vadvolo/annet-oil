annet_containers:
  - name: "annet-default"
    container_name: "annet-default"
    default: true
    description: "Default annet container"
  - name: "annet-telnet"
    container_name: "annet-telnet"
    description: "Telnet devices container"
  - name: "annet-ssh-10022"
    container_name: "annet-ssh-10022"
    description: "SSH 10022 devices container"

ssh_keys:
  - name: "default"
    path: "/keys/id_rsa"
    user: "admin"
  - name: "telnet"
    path: "/keys/telnet_key"
    user: "telnet_user"

server:
  ssh:
    port: 22
    bind: "0.0.0.0"
  api:
    port: 8080
    bind: "0.0.0.0"
    auth_token: "change-me-in-production"

storage:
  routing_file: "./storage/routing.json"
  inventory_file: "./resources/inventory.yaml"

gnetcli:
  host: "grpc.gnetcli.example.com"
  port: 50051
  auth_token: "TOKEN"
  # Default device credentials (will be replaced with actual values from environment)
  login: "${DEVICE_USERNAME}"
  password: "${DEVICE_PASSWORD}"
  tls: false

docker:
  # Configuration for Colima
  # Replace username with your username
  host: "unix:///Users/username/.colima/default/docker.sock"
  api_version: "1.41"
  tls_verify: false
