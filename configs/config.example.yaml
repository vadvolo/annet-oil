# Annet Oil Configuration Example
# Copy to config.yaml and customize for your environment

# Annet containers configuration
annet_containers:
  - name: "annet-default"
    container_name: "annet-default"
    default: true
    description: "Default annet container"
  - name: "annet-telnet"
    container_name: "annet-telnet"
    description: "Telnet devices container"

# SSH keys for device connections
ssh_keys:
  - name: "default"
    path: "/keys/id_rsa"
    user: "admin"
  - name: "telnet"
    path: "/keys/telnet_key"
    user: "telnet_user"

# Server configuration
server:
  ssh:
    port: 22
    bind: "0.0.0.0"
  api:
    port: 8080
    bind: "0.0.0.0"
    # Legacy auth token (grants admin access)
    # For production, use RBAC users instead
    auth_token: "${ANNET_OIL_AUTH_TOKEN}"
    # Hard wall-clock cap the HTTP layer puts on a single request. Must be
    # >= gnetcli.max_timeout_sec so large diagnostic outputs (e.g. Eltex MES
    # "show logging"/"show interfaces" on high-port switches) can finish.
    # 0 or omitted -> 120s default.
    request_timeout_sec: 120

# Storage paths
storage:
  routing_file: "./storage/routing.json"
  inventory_file: "./resources/inventory.yaml"

# Gnetcli configuration (for command execution)
gnetcli:
  host: "localhost"
  port: 50051
  auth_token: "${GNETCLI_AUTH_TOKEN}"
  login: "${DEVICE_USERNAME}"
  password: "${DEVICE_PASSWORD}"
  tls: false
  # Per-command timeouts in seconds. read_timeout_sec is the gap allowed between
  # reads (a stalled pager or a slowly-streamed large table trips this);
  # cmd_timeout_sec bounds the whole command. 0 = inherit the gnetcli server
  # default. Raise these so large-output diagnostics ("show interfaces" on a
  # switch with many ports) complete instead of failing with READ_TIMEOUT.
  read_timeout_sec: 30
  cmd_timeout_sec: 60
  # Upper bound for a per-request timeout_s override on /api/v0/execute. 0 = no cap.
  max_timeout_sec: 120

# Docker configuration
docker:
  # For Docker Desktop on Mac
  # host: "unix:///var/run/docker.sock"
  # For Colima on Mac (replace username)
  host: "unix:///Users/username/.colima/default/docker.sock"
  # For Linux
  # host: "unix:///var/run/docker.sock"
  api_version: "1.41"
  tls_verify: false

# Logging configuration
logging:
  # Log level: debug, info, warn, error
  level: "info"
  # Output format: json (recommended for production) or text
  format: "json"
  # File path for logs (empty = stdout only)
  output: ""
  # output: "/var/log/annet-oil/api.log"
  # S3 upload for log archival
  s3:
    enabled: false
    bucket: ""
    prefix: "logs/annet-oil/"
    region: "us-east-1"

# Checkeast: run a diff and archive it to S3-compatible storage.
# Independent of the log-archival S3 config above; supports a custom endpoint
# (MinIO). AWS credentials come from the environment (AWS_ACCESS_KEY_ID / …),
# not this file.
checkeast:
  s3:
    enabled: false
    bucket: "network-diffs"
    prefix: "diffs/annet-oil/"
    region: "us-east-1"
    endpoint: ""          # leave empty for AWS; e.g. http://localhost:9000 for MinIO
    # How long archived diffs are kept before expiring (bucket lifecycle rule
    # scoped to the prefix). 0 = default (3 days); negative = disable lifecycle.
    retention_days: 3

# Audit trail: who ran which command on which devices, queryable via
# GET /api/v0/audit. Disabled by default (no database required). When enabled,
# requires PostgreSQL.
audit:
  enabled: false
  # Either a full DSN…
  dsn: ""               # postgres://user:pass@host:5432/annet_oil?sslmode=disable
  # …or discrete fields (used when dsn is empty):
  host: "localhost"
  port: 5432
  user: "annet"
  password: "${AUDIT_DB_PASSWORD}"
  database: "annet_oil"
  ssl_mode: "disable"
  buffer_size: 1024     # async write queue size

# Request caching
cache:
  enabled: true
  # Cache TTL (e.g., 5m, 1h)
  ttl: "5m"
  # Maximum cache size (e.g., 100MB, 1GB)
  max_size: "100MB"

# External integrations
integrations:
  # Jira integration for RFC workflow
  jira:
    enabled: false
    url: "https://company.atlassian.net"
    email: "service@company.com"
    token: "${JIRA_API_TOKEN}"
    project_key: "NET"
    issue_type: "Task"
  # GitHub integration
  github:
    enabled: false
    token: "${GITHUB_TOKEN}"

# Authentication and authorization (RBAC)
# See resources/groups.example.yaml for detailed examples
auth:
  # Define custom roles
  roles:
    - name: "operator"
      device_scopes: ["*"]
      methods: ["/gen", "/diff", "/patch", "/deploy", "/execute", "/containers", "/routing", "/inventory", "/check", "/health", "/rfc"]
      commands: ["show *", "ping *", "traceroute *"]
    - name: "viewer"
      device_scopes: ["*"]
      methods: ["/gen", "/diff", "/routing", "/health", "/containers", "/inventory", "/check"]
      commands: ["show *"]
    - name: "lab-admin"
      device_scopes: ["lab-*", "test-*", "dev-*"]
      methods: ["*"]
      commands: ["*"]

  # User groups (optional)
  groups:
    - name: "network-ops"
      role: "operator"
      members: ["alice", "bob"]
    - name: "developers"
      role: "lab-admin"
      members: ["dev1", "dev2"]

  # Users with tokens
  users:
    - name: "admin"
      token: "${ADMIN_TOKEN}"
      role: "admin"
    - name: "alice"
      token: "${ALICE_TOKEN}"
      # role: inherited from group
    - name: "bob"
      token: "${BOB_TOKEN}"
      # role: inherited from group
