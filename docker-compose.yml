
version: '3.3'

services:
  annet-oil:
    build: .
    container_name: annet-oil
    ports:
      - "2222:22"    # SSH port
      - "8080:8080"  # API port
    volumes:
      - ./configs:/app/configs:ro
      - ./storage:/app/storage
      - ./keys:/app/keys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - ANNET_OIL_CONFIG=/app/configs/config.yaml
      - ANNET_OIL_AUTH_TOKEN=${ANNET_OIL_AUTH_TOKEN:-change-me-in-production}
    restart: unless-stopped
    depends_on:
      - annet-default
      - annet-telnet
      - annet-orion
    networks:
      - annet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MCP Annet Oil Server
  mcp-annet-oil:
    build:
      context: ./mcp-annet-oil
      dockerfile: Dockerfile
    container_name: mcp-annet-oil
    environment:
      - ANNET_OIL_API_URL=http://annet-oil:8080
      - ANNET_OIL_AUTH_TOKEN=${ANNET_OIL_AUTH_TOKEN:-change-me-in-production}
      - NODE_ENV=production
    depends_on:
      annet-oil:
        condition: service_healthy
    networks:
      - annet-network
    restart: unless-stopped
    stdin_open: true
    tty: true
    # For MCP stdio transport - can be accessed via docker exec
    command: ["node", "dist/index.js"]

  annet-default:
    image: annet:latest
    container_name: annet-default
    command: tail -f /dev/null
    volumes:
      - ./annet-configs/default:/app/configs
      - ./annet-data/default:/app/data
    restart: unless-stopped
    networks:
      - annet-network

  annet-telnet:
    image: annet-telnet:latest
    container_name: annet-telnet
    command: tail -f /dev/null
    volumes:
      - ./annet-configs/telnet:/app/configs
      - ./annet-data/telnet:/app/data
    restart: unless-stopped
    networks:
      - annet-network

  annet-orion:
    image: annet-orion:latest
    container_name: annet-orion
    command: tail -f /dev/null
    volumes:
      - ./annet-configs/orion:/app/configs
      - ./annet-data/orion:/app/data
    restart: unless-stopped
    networks:
      - annet-network

networks:
  annet-network:
    driver: bridge

volumes:
  annet-oil-data:
  annet-default-data:
  annet-telnet-data:
  annet-orion-data: